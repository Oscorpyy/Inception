# Network configuration
# Bind to all network interfaces so other containers in the Docker network can connect
bind 0.0.0.0

# Disable protected mode since Redis is only exposed on the private internal Docker network
protected-mode no

# Port to listen on
port 6379

# Run Redis in the foreground (required for Docker containers)
daemonize no

# Memory management for WordPress object caching
# Set maximum memory limit
maxmemory 256mb

# Eviction policy: remove least recently used keys when maxmemory is reached
maxmemory-policy allkeys-lru
